name: OpenWrt Builder

on:
  workflow_dispatch:
  # push:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

env:
  REMOTE_REPOSITORY: qosmio/openwrt-ipq
  REMOTE_BRANCH: 25.12-nss
  TARGET: qualcommax
  SUBTARGET: ipq807x
  DEVICE: ap8220
  CONFIG_FILE: build.config
  CUSTOM_FILES_PATH: files/
  RELEASE_PREFIX: openwrt-qualcommax-ipq807x
  NSS_PACKAGES_REPOSITORY: qosmio/nss-packages
  NSS_PACKAGES_REPOSITORY_BRANCH: NSS-12.5-K6.x
  
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check_commits:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      remote_new_commits: ${{ steps.check_remote_new_commits.outputs.new_commits }}
      remote_latest_commit_sha: ${{ steps.check_remote_new_commits.outputs.latest_commit_sha }}
      nss_packages_new_commits: ${{ steps.check_nss_packages_new_commits.outputs.new_commits }}
      nss_packages_latest_commit_sha: ${{ steps.check_nss_packages_new_commits.outputs.latest_commit_sha }}
      self_new_commits: ${{ steps.check_self_new_commits.outputs.new_commits }}
    steps:
      - name: Check for new commits in Remote Repository
        id: check_remote_new_commits
        run: |
          # Get the latest commit sha from the remote repository
          latest_commit_sha=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ env.REMOTE_REPOSITORY }}/commits?sha=${{ env.REMOTE_BRANCH }}&per_page=1" | jq -r '.[0].sha')
    
          # Get the last built commit sha from the release body
          last_built_commit_sha=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'Remote Commit: \K\w+' || echo '')
    
          # Print commit SHAs for debugging
          echo "Latest commit sha (Remote): $latest_commit_sha"
          echo "Last built commit sha (Remote): $last_built_commit_sha"
    
          # Compare commit SHAs and set new_commits output
          if [[ "$latest_commit_sha" != "$last_built_commit_sha" && -n "$latest_commit_sha" ]]; then
            echo "new_commits=true" >> $GITHUB_OUTPUT
          else
            echo "new_commits=false" >> $GITHUB_OUTPUT
          fi
    
          # Output latest commit sha for future steps
          echo "latest_commit_sha=$latest_commit_sha" >> $GITHUB_OUTPUT

      - name: Check for new commits in NSS Packages Repository
        id: check_nss_packages_new_commits
        run: |
          # Get the latest commit sha from the NSS packages repository
          latest_commit_sha=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ env.NSS_PACKAGES_REPOSITORY }}/commits?sha=${{ env.NSS_PACKAGES_REPOSITORY_BRANCH }}&per_page=1" | jq -r '.[0].sha')
    
          # Get the last built commit sha from the release body
          last_built_commit_sha=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'NSS Packages Commit: \K\w+' || echo '')
    
          # Print commit SHAs for debugging
          echo "Latest commit sha (NSS): $latest_commit_sha"
          echo "Last built commit sha (NSS): $last_built_commit_sha"
    
          # Compare commit SHAs and set new_commits output
          if [[ "$latest_commit_sha" != "$last_built_commit_sha" && -n "$latest_commit_sha" ]]; then
            echo "new_commits=true" >> $GITHUB_OUTPUT
          else
            echo "new_commits=false" >> $GITHUB_OUTPUT
          fi
    
          # Output latest commit sha for future steps
          echo "latest_commit_sha=$latest_commit_sha" >> $GITHUB_OUTPUT
          
      - name: Check for new commits in Self Repository
        id: check_self_new_commits
        run: |
          # 获取当前仓库最新的 Commit SHA
          latest_commit_sha="${{ github.sha }}"

          # 从最新的 Release 说明中获取上次构建的 Self Commit
          last_built_commit_sha=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -oP 'Self Commit: \K\w+' || echo '')

          echo "Latest commit sha (Self): $latest_commit_sha"
          echo "Last built commit sha (Self): $last_built_commit_sha"

          if [[ "$latest_commit_sha" != "$last_built_commit_sha" && -n "$latest_commit_sha" ]]; then
            echo "new_commits=true" >> $GITHUB_OUTPUT
          else
            echo "new_commits=false" >> $GITHUB_OUTPUT
          fi
          
  build:
    name: Build OpenWrt
    needs: check_commits
    if: needs.check_commits.outputs.remote_new_commits == 'true' || needs.check_commits.outputs.nss_packages_new_commits == 'true' || needs.check_commits.outputs.self_new_commits == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      #- name: Debug output values
      #  run: |
      #    echo "needs.check_commits.outputs.new_commits: ${{ needs.check_commits.outputs.new_commits }}"
      #    echo "needs.check_commits.outputs.nss_packages_repo_new_commits: ${{ needs.check_commits.outputs.nss_packages_repo_new_commits }}"
      #    echo "Latest commit sha from remote repository: ${{ needs.check_commits.outputs.latest_commit_sha }}"
      #    echo "Latest commit sha from NSS packages repository: ${{ needs.check_commits.outputs.nss_packages_repo_latest_commit_sha }}"

      #- name: Free up disk space before installation
      #  run: |
      #    echo "Before cleanup:"
      #    df -h
      #    sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
      #    sudo apt-get clean
      #    sudo apt-get autoremove -y
      #    echo "After cleanup:"
      #    df -h
      
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      #- name: "Optimize Disk Space"
      #  uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      #  with:
      #    operate_sudo: "True"
      #    general_include: ".+"
      #    general_exclude: |-
      #      ^GCC$
      #      ^G\+\+$
      #      Clang
      #      LLVM
      #    docker_include: ".+"
      #    docker_prune: "True"
      #    docker_clean: "True"
      #    apt_prune: "True"
      #    apt_clean: "True"
      #    homebrew_prune: "True"
      #    homebrew_clean: "True"
      #    npm_prune: "True"
      #    npm_clean: "True"
      #    os_swap: "True"

      - name: Freeing up disk space
        uses: easimon/maximize-build-space@master
        with: 
          root-reserve-mb: 2048
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout remote repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}
      
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: "builder_repo"

      - name: Add extra packages
        run: |
          # Clone extra LuCI packages directly into the correct directory
          git clone --depth=1 --single-branch https://github.com/jerrykuku/luci-theme-argon package/extra-packages/luci-theme-argon
          git clone --depth=1 --single-branch https://github.com/gSpotx2f/luci-app-temp-status package/extra-packages/luci-app-temp-status
          git clone --depth=1 --single-branch https://github.com/gSpotx2f/luci-app-cpu-status-mini package/extra-packages/luci-app-cpu-status-mini
          git clone --depth=1 --single-branch https://github.com/sbwml/luci-app-airconnect package/extra-packages/luci-app-airconnect
          git clone --depth=1 --single-branch https://github.com/sbwml/package_kernel_r8152 package/extra-packages/package_kernel_r8152
          git clone --depth=1 --single-branch https://github.com/gtolog/openwrt-msd_lite package/extra-packages/openwrt-msd_lite
          git clone --depth=1 --single-branch https://github.com/qosmio/packages-extra package/extra-packages/luci-mod-status-nss

          # M2 同款插件 (immortalwrt 系)
          git clone --depth=1 --single-branch https://github.com/immortalwrt/homeproxy package/extra-packages/homeproxy
          # homeproxy 的 LUCI_DEPENDS 是 +sing-box(符号依赖), 会被 metadata 同时展开到
          # PROVIDES sing-box 的 tiny 变体和 full 本体, 配合 sing-box 双变体互斥生成
          # 三方递归依赖 (homeproxy -> tiny -> full <- select homeproxy), Kconfig 直接报错。
          # 改为直接依赖 +sing-box-tiny 绕开 PROVIDES 解析环
          sed -i 's|+sing-box \\$|+sing-box-tiny \\|' package/extra-packages/homeproxy/Makefile
          git clone --depth=1 --single-branch https://github.com/gdy666/luci-app-lucky package/extra-packages/lucky-src
          git clone --depth=1 --single-branch https://github.com/sbwml/luci-app-mosdns package/extra-packages/mosdns-src
          # mosdns 仓库是多包结构(luci-app-mosdns/ + mosdns/ + v2dat/):
          # 直接 clone 会让 sbwml 的 mosdns 守护包和 immortalwrt sparse clone 的 net/mosdns
          # 重复定义(谁赢随机, 08-09 实测 sbwml 5.3.3 赢了 -> init 脚本和 app 装包冲突)。
          # 只取 app 子目录, 守护进程统一用 immortalwrt/packages 的 net/mosdns。
          cp -r package/extra-packages/mosdns-src/luci-app-mosdns package/extra-packages/luci-app-mosdns
          rm -rf package/extra-packages/mosdns-src
          # app 自带的 init 脚本和 mosdns 守护包重复 -> 删掉 app 的, 守护包提供
          rm -f package/extra-packages/luci-app-mosdns/root/etc/init.d/mosdns
          # lucky: 仓库含 luci-app-lucky + lucky 两个目录, 直接复制到 package/
          cp -r package/extra-packages/lucky-src/luci-app-lucky package/extra-packages/luci-app-lucky
          cp -r package/extra-packages/lucky-src/lucky package/extra-packages/lucky

          # immortalwrt-packages: 只取需要的 net 子包 (sparse clone 省流量)
          git clone --depth=1 --filter=blob:none --sparse --single-branch https://github.com/immortalwrt/packages.git package/extra-packages/immortalwrt-packages
          cd package/extra-packages/immortalwrt-packages
          git sparse-checkout set net/mosdns net/ddns-go net/vlmcsd net/irqbalance net/sing-box utils/irqbalance lang/golang
          git checkout
          cd ../../../
          cp -r package/extra-packages/immortalwrt-packages/net/mosdns package/extra-packages/mosdns
          cp -r package/extra-packages/immortalwrt-packages/net/ddns-go package/extra-packages/ddns-go
          cp -r package/extra-packages/immortalwrt-packages/net/vlmcsd package/extra-packages/vlmcsd
          cp -r package/extra-packages/immortalwrt-packages/net/sing-box package/extra-packages/sing-box
          cp -r package/extra-packages/immortalwrt-packages/utils/irqbalance package/extra-packages/irqbalance
          # golang 必须复制到 package/lang/golang 而不是 extra-packages/lang/golang:
          # sing-box/mosdns/ddns-go 的 Makefile 用 include ../../lang/golang/golang-package.mk,
          # 从 package/extra-packages/<pkg>/ 出发 ../.. 指向 package/, 所以只有
          # package/lang/golang/golang-package.mk 能被 include 到。
          # 复制错位置 -> GO_ARCH_DEPENDS 未定义 -> Package/*/config 里 depends on 空语句
          # -> Kconfig "invalid statement + syntax error"
          mkdir -p package/lang
          cp -r package/extra-packages/immortalwrt-packages/lang/golang package/lang/golang

          # immortalwrt-luci: 只取需要的 app (sparse clone)
          git clone --depth=1 --filter=blob:none --sparse --single-branch https://github.com/immortalwrt/luci.git package/extra-packages/immortalwrt-luci
          cd package/extra-packages/immortalwrt-luci
          git sparse-checkout set applications/luci-app-vlmcsd applications/luci-app-zerotier applications/luci-app-irqbalance applications/luci-app-autoreboot applications/luci-app-cpufreq applications/luci-app-upnp applications/luci-app-ddns-go
          git checkout
          cd ../../../
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-vlmcsd package/extra-packages/luci-app-vlmcsd
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-zerotier package/extra-packages/luci-app-zerotier
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-irqbalance package/extra-packages/luci-app-irqbalance
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-autoreboot package/extra-packages/luci-app-autoreboot
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-cpufreq package/extra-packages/luci-app-cpufreq
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-upnp package/extra-packages/luci-app-upnp
          cp -r package/extra-packages/immortalwrt-luci/applications/luci-app-ddns-go package/extra-packages/luci-app-ddns-go

          # 修复: immortalwrt/luci 的 app Makefile 用相对 include ../../luci.mk,
          # cp 到 package/extra-packages/ 后 ../../ 解析到 package/(无 luci.mk),
          # 包扫描静默失败 -> CONFIG_PACKAGE_luci-app-* =y 被忽略 (7个UI包全没编进去)。
          # 改成与 lucky/homeproxy/argon 一致的绝对路径 include。
          for d in luci-app-vlmcsd luci-app-zerotier luci-app-irqbalance luci-app-autoreboot luci-app-cpufreq luci-app-upnp luci-app-ddns-go; do
            sed -i 's|include \.\./\.\./luci\.mk|include $(TOPDIR)/feeds/luci/luci.mk|' package/extra-packages/$d/Makefile
          done
          echo "=== 修复后 include 行确认 ==="
          grep -h 'include' package/extra-packages/luci-app-*/Makefile | sort -u

          # 清理临时目录
          rm -rf package/extra-packages/lucky-src package/extra-packages/immortalwrt-packages package/extra-packages/immortalwrt-luci
          
      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-kernel-${{ runner.os }}-${{ needs.check_commits.outputs.remote_latest_commit_sha }}-${{ needs.check_commits.outputs.nss_packages_latest_commit_sha }}
          #restore-keys: |
          #  ccache-kernel-${{ runner.os }}-

      - name: Cache built host tools
        id: cache-built-host-tools
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/staging_dir/host
            ${{ github.workspace }}/build_dir/host
          key: host-tools-${{ runner.os }}-${{ needs.check_commits.outputs.remote_latest_commit_sha }}-${{ needs.check_commits.outputs.nss_packages_latest_commit_sha }}
          #restore-keys: |
          #  host-tools-${{ runner.os }}-
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

          sudo apt-get clean
          sudo apt-get autoremove -y
            
      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # luci.mk DEFAULT 补丁必须赶在任何 make/scan 之前打 (i18n 隐藏符号只认 DEFAULT 表达式,
          # 不加 ||PACKAGE_$(PKG_NAME) 的话 .config 显式 =y 会被 Kconfig 丢弃 -> 界面英文)
          if [ -f feeds/luci/luci.mk ]; then
            sed -i 's|DEFAULT:=LUCI_LANG_\$(2)\|\|(ALL&&m)|DEFAULT:=LUCI_LANG_\$(2)\|\|(ALL\&\&m)\|\|PACKAGE_$(PKG_NAME)|' feeds/luci/luci.mk
            grep -m1 'DEFAULT:=LUCI_LANG' feeds/luci/luci.mk || true
          fi

      - name: Add custom patches
        run: |
          # Apply OpenWrt patches
          if [ "$(ls builder_repo/patches/openwrt 2>/dev/null)" ]; then
            mv builder_repo/patches/openwrt/*.patch ./
            for patch in *.patch; do
              git apply --verbose "$patch"
              echo "=== Diff after applying $patch ==="
              git diff HEAD
            done
            echo "Changed files after OpenWrt patch application:"
            git status
          fi
      
          # Apply Luci patches
          if [ "$(ls builder_repo/patches/luci 2>/dev/null)" ]; then
            mkdir -p feeds/luci/patches
            mv builder_repo/patches/luci/*.patch feeds/luci/patches/
            cd feeds/luci
      
            for patch in patches/*.patch; do
              git apply --verbose "$patch"
              echo "=== Diff after applying $patch ==="
              git diff HEAD
            done
      
            echo "Changed files after Luci patch application:"
            git status
          fi
  
      - name: Configure firmware image
        run: |
          mv builder_repo/${{ env.CONFIG_FILE }} .config
          # 根因(2026-08-09 实测): OpenWrt 的 make defconfig = conf --defconfig=.config,
          # 该模式会丢弃【无提示符】(HIDDEN:=1)符号的显式 =y, 按 Kconfig 默认 n 处理。
          # luci-i18n-* 全是 HIDDEN:=1 -> defconfig 后被强制 "is not set", 界面英文。
          # 改用 conf --olddefconfig: 尊重 .config 里所有显式值(含隐藏符号), 非交互补默认。
          # 强制重建 metadata 扫描缓存: extra-packages 的 .packageinfo 不感知 feeds/luci/luci.mk 变更,
          # 不清的话 i18n 符号沿用 patch 前的旧 DEFAULT -> 8个翻译包缺失
          rm -rf tmp/info
          make scripts/config/conf prepare-tmpinfo > /tmp/meta.log 2>&1 || { echo "=== METADATA FAILED ==="; tail -20 /tmp/meta.log; exit 1; }
          # 缺依赖预检: 只盯 extra-packages 的【运行时】依赖警告, 且仅当该包在 .config 里 =y 时才算数
          # (2026-08-09 实测: luci-app-cpufreq 依赖不存在的 cpufreq 包, make world 1小时后 image 装包才炸。
          #  =n 的包(如已移除的 cpufreq)警告无害, 必须过滤; feeds 早期扫描误报在重扫后消失)
          bad=""
          while read -r line; do
            pkg=$(echo "$line" | sed -n 's|.*package/extra-packages/\([^/]*\)/Makefile.*|\1|p')
            if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "SELECTED package has missing dep: $line"
              bad=1
            fi
          done < <(grep -E "package/extra-packages/.*has a dependency on" /tmp/meta.log || true)
          [ -z "$bad" ] || { echo "!!! MISSING DEPENDENCY PACKAGES DETECTED !!!"; exit 1; }
          ./scripts/config/conf --olddefconfig Config.in || { echo "=== KCONFIG ERROR ==="; grep -n "syntax error\|invalid statement" tmp/.config-package.in; exit 1; }

      - name: Verify required packages in .config
        run: |
          # 验证门: 缺的包必须 =y, 剔除的包必须不在。defconfig 后立刻查, 防静默出半成品固件。
          missing=""
          for pkg in luci-app-vlmcsd luci-app-zerotier luci-app-irqbalance luci-app-autoreboot luci-app-upnp luci-app-ddns-go miniupnpd-nftables luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-homeproxy-zh-cn luci-i18n-vlmcsd-zh-cn luci-i18n-ddns-go-zh-cn luci-i18n-zerotier-zh-cn luci-i18n-upnp-zh-cn luci-i18n-irqbalance-zh-cn luci-i18n-autoreboot-zh-cn; do
            grep -q "CONFIG_PACKAGE_${pkg}=y" .config || missing="$missing $pkg"
          done
          extra=""
          for pkg in watchcat luci-app-watchcat hd-idle luci-app-hd-idle airconnect luci-app-airconnect lucky luci-app-lucky; do
            grep -q "CONFIG_PACKAGE_${pkg}=y" .config && extra="$extra $pkg"
          done
          if [ -n "$missing" ] || [ -n "$extra" ]; then
            [ -z "$missing" ] || echo "MISSING PACKAGES:$missing"
            [ -z "$extra" ] || echo "STILL ENABLED:$extra"
            echo "=== DIAG: 逐包查符号存在性与完整 Kconfig 块 ==="
            for pkg in $missing; do
              if grep -q "config PACKAGE_$pkg" tmp/.config-package.in 2>/dev/null; then
                echo "--- $pkg: 符号存在, 但 .config 未选中 ---"
                grep -A9 "config PACKAGE_$pkg" tmp/.config-package.in 2>/dev/null | head -11
              else
                echo "--- $pkg: 符号不存在于 config-package.in ---"
              fi
            done
            echo "=== DIAG: 对照组 luci-i18n-acl-ar 完整块(能生成的) ==="
            grep -A9 "config PACKAGE_luci-i18n-acl-ar" tmp/.config-package.in 2>/dev/null | head -11
            echo "=== DIAG: 已选中的 base-zh-cn 完整块(对照组) ==="
            grep -A9 "config PACKAGE_luci-i18n-base-zh-cn" tmp/.config-package.in 2>/dev/null | head -11
            echo "=== DIAG: 合成符号 DEFAULT_xxx 块 ==="
            for s in DEFAULT_luci-i18n-base-zh-cn DEFAULT_luci-i18n-vlmcsd-zh-cn DEFAULT_luci-i18n-homeproxy-zh-cn; do
              echo "--- $s ---"
              grep -A3 "config $s" tmp/.config-package.in 2>/dev/null | head -5
            done
            echo "=== DIAG: runner 上重新 DUMP extra 包, 看 Default: 原始行 ==="
            (cd package/extra-packages/luci-app-vlmcsd && make DUMP=1 2>/dev/null | grep -a -A1 'Package: luci-i18n-vlmcsd-zh-cn' | head -4; echo "--- luci.mk 当前 DEFAULT 行 ---"; grep -m1 'DEFAULT:=LUCI_LANG' "${{ github.workspace }}/feeds/luci/luci.mk")
            echo "=== DIAG: .config 中 luci-i18n 精确状态(=y / =n / is not set / 不存在) ==="
            grep -n 'CONFIG_PACKAGE_luci-i18n' .config 2>/dev/null | head -8
            echo "--- .config 中 luci-i18n 条目总数: $(grep -c 'CONFIG_PACKAGE_luci-i18n' .config 2>/dev/null) ---"
            echo "=== DIAG: 对照组 .config 中 luci-app-vlmcsd 条目 ==="
            grep -n 'CONFIG_PACKAGE_luci-app-vlmcsd' .config 2>/dev/null
            echo "=== DIAG: config-package.in 中 i18n 符号总数 ==="
            grep -c "config PACKAGE_luci-i18n" tmp/.config-package.in 2>/dev/null
            echo "=== DIAG: DEFAULT_luci-i18n-base-zh-cn ==="
            grep -B1 -A3 "DEFAULT_luci-i18n-base-zh-cn" tmp/.config-package.in 2>/dev/null | head -10
            exit 1
          fi
          echo "VERIFY OK: required packages all present, removed packages all gone"

      - name: Include custom files
        run: |
          mkdir -p ${{ env.CUSTOM_FILES_PATH }}
          mv builder_repo/${{ env.CUSTOM_FILES_PATH }}* ${{ env.CUSTOM_FILES_PATH }}
          
      - name: Parse toolchain file
        run: |
          TOOLCHAIN_STRING="$(curl "https://downloads.cdn.openwrt.org/snapshots/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums" \
            | grep ".*openwrt-toolchain.*tar.zst")"
          TOOLCHAIN_FILE=$(echo "$TOOLCHAIN_STRING" | sed -n -e 's/.*\(openwrt-toolchain.*\).tar.zst/\1/p')
          TOOLCHAIN_SHA256=$(echo "$TOOLCHAIN_STRING" | cut -d ' ' -f 1)
          
          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_SHA256=$TOOLCHAIN_SHA256" >> "$GITHUB_ENV"
 
      - name: Cache external toolchain
        id: cache-external-toolchain
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/${{ env.TOOLCHAIN_FILE }}
          key: ${{ env.TOOLCHAIN_FILE }}-${{ env.TOOLCHAIN_SHA256 }}
 
      - name: Download external toolchain
        if: ${{ steps.cache-external-toolchain.outputs.cache-hit != 'true' }}
        run: |
          wget -O - https://downloads.cdn.openwrt.org/snapshots/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/${{ env.TOOLCHAIN_FILE }}.tar.zst \
            | tar --zstd -xf -

      - name: Configure external toolchain
        run: |
          ./scripts/ext-toolchain.sh \
            --toolchain ${{ env.TOOLCHAIN_FILE }}/toolchain-* \
            --overwrite-config \
            --config ${{ env.TARGET }}/${{ env.SUBTARGET }}

      - name: Configure host tools
        if: ${{ steps.cache-built-host-tools.outputs.cache-hit == 'true' }}
        run: |
          if [[ -d "./build_dir/host" && -d "./staging_dir/host" ]]; then
             ./scripts/ext-tools.sh --refresh
          else
            echo "One or both of the required directories do not exist."
          fi

      - name: Download dependencies
        run: make download -j$(nproc)

      - name: Build the firmware image
        run: make world -j$(nproc) V=sc
        
      - name: Clean up before packaging
        run: |
          rm -rf bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.tmp
          
      - name: Package output
        run: tar -cvf ${{ env.SUBTARGET }}-images.tar bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SUBTARGET }}-images
          path: ${{ env.SUBTARGET }}-images.tar

  release:
    name: Create release
    needs: [build, check_commits]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SUBTARGET }}-images
      
      - name: Extract artifacts
        run: tar xf ${{ env.SUBTARGET }}-images.tar
      
      - name: Get current date
        run: echo "RELEASE_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*
          tag_name: ${{ env.REMOTE_BRANCH }}-${{ env.RELEASE_DATE }}
          name: Updated prebuilt images ${{ env.REMOTE_BRANCH }} ${{ env.RELEASE_DATE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Remote Commit: ${{ needs.check_commits.outputs.remote_latest_commit_sha }}
            NSS Packages Commit: ${{ needs.check_commits.outputs.nss_packages_latest_commit_sha }}
            Self Commit: ${{ github.sha }}
      
      - name: Clean up old releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
